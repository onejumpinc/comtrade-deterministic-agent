[project]
name = "comtrade-deterministic-agent"
version = "1.0.0"
description = "Model-free live-API participant for ComtradeBench"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]==0.3.20",
    "requests>=2.34.2",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["purple_agent", "run_a2a"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
